<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Fincall</title>
  <!-- Versión reducida de la marca para tamaños pequeños: la voz (barras) y la llamada resuelta (check) -->
  <style>
    .a { stop-color: #ff3b2f } .b { stop-color: #d0122f } .sello { fill: #15121b } .check { stroke: #fff }
    @media (prefers-color-scheme: dark) { .a { stop-color: #ff4a3d } .b { stop-color: #ff8f86 } .sello { fill: #fff } .check { stroke: #15121b } }
  </style>
  <defs>
    <linearGradient id="g" x1="4" y1="0" x2="22" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="a"/><stop offset="1" class="b"/>
    </linearGradient>
  </defs>
  <path d="M6 25 V39 M17 16 V48" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
  <circle class="sello" cx="43" cy="32" r="17"/>
  <path class="check" d="M35 32.5 L41 38.5 L51.5 26.5" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
