# Building Call Assistant — desarrollo local con Docker Compose.
#
#   docker compose up -d db            # solo PostgreSQL (backend y frontend en tu máquina)
#   docker compose up -d               # todo: db + api + web
#   docker compose --profile tools run --rm migrations   # alembic upgrade head + semilla
#
# Secretos y claves de proveedores van en backend/.env (ignorado por git); aquí solo defaults.
# Ollama corre en el host (GPU): la API lo alcanza en host.docker.internal:11434.

name: building-call

services:
  db:
    image: postgres:17-alpine
    container_name: building-call-db
    restart: unless-stopped # la base de datos vuelve sola al arrancar Docker
    environment:
      POSTGRES_DB: building_call
      POSTGRES_USER: building_call
      POSTGRES_PASSWORD: ${BC_DB_PASSWORD:-building_call_dev}
    ports:
      - "127.0.0.1:5433:5432" # 5433 para no chocar con el PostgreSQL 17 instalado en Windows
    volumes:
      - db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U building_call -d building_call"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: building-call-api
    env_file:
      - backend/.env
    environment:
      BC_REPOSITORY: postgres
      BC_DATABASE_URL: postgresql+asyncpg://building_call:${BC_DB_PASSWORD:-building_call_dev}@db:5432/building_call
      BC_OLLAMA_URL: http://host.docker.internal:11434
      BC_AUDIO_DIR: /datos/audio
      BC_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      # Owner inicial de la consola (solo se crea si no hay usuarios; cambio obligatorio al entrar)
      BC_ADMIN_INICIAL_USUARIO: ${BC_ADMIN_INICIAL_USUARIO:-admin}
      BC_ADMIN_INICIAL_CONTRASENA: ${BC_ADMIN_INICIAL_CONTRASENA:-admin}
    volumes:
      - audio_privado:/datos/audio
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrations:
    build: ./backend
    profiles: ["tools"]
    env_file:
      - backend/.env
    environment:
      BC_REPOSITORY: postgres
      BC_DATABASE_URL: postgresql+asyncpg://building_call:${BC_DB_PASSWORD:-building_call_dev}@db:5432/building_call
    command: ["sh", "-c", "alembic upgrade head && python -m building_call.repos.seed"]
    depends_on:
      db:
        condition: service_healthy

  # Servidor de medios de LiveKit, autoalojado (spec 2026-10-21). En modo --dev usa las claves
  # devkey / secret: BC_LIVEKIT_API_KEY=devkey, BC_LIVEKIT_API_SECRET=secret. Solo para local.
  #   docker compose --profile voice up -d livekit
  #   cd backend; uv run --extra voice building-call-agent dev
  livekit:
    image: livekit/livekit-server:v1.13.8
    profiles: ["voice"]
    container_name: building-call-livekit
    # Redis: lo necesita livekit-sip para hablar con el servidor
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1", "--redis-host", "redis:6379"]
    ports:
      - "127.0.0.1:7880:7880" # señalización (ws)
      - "127.0.0.1:7881:7881" # ICE por TCP
      - "127.0.0.1:7882:7882/udp" # medios (UDP)
      # livekit-sip comparte la red de este contenedor (ver abajo): sus puertos se publican aquí
      - "127.0.0.1:5060:5060/udp" # SIP
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:30000-30199:30000-30199/udp" # audio RTP de las llamadas SIP
    depends_on:
      - redis

  redis:
    image: redis:7.4.1-alpine
    profiles: ["voice"]
    container_name: building-call-redis

  # Entrada de llamadas SIP (spec 2026-10-22-telnyx-sip-pilot-design). En local, un softphone
  # (Linphone, MicroSIP) llama a sip:<BC_SIP_NUMBER>@127.0.0.1; luego se configura con
  #   cd backend; uv run --extra voice python -m building_call.telephony.configure_sip
  # Comparte la red de `livekit` para que 127.0.0.1 (la IP que anuncia el servidor) sea él.
  livekit-sip:
    image: livekit/sip:v1.17.0
    profiles: ["voice"]
    container_name: building-call-livekit-sip
    network_mode: "service:livekit"
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://127.0.0.1:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 30000-30199
        use_external_ip: false
        nat_1_to_1_ip: 127.0.0.1
        listen_ip: 0.0.0.0 # Docker publica los puertos hacia eth0, no hacia el loopback
        # Sin G.722 (HD) se negocia G.711, el audio de una línea telefónica normal
        codecs:
          G722: false
        logging:
          level: info
    depends_on:
      - livekit

  web:
    build: ./frontend
    container_name: building-call-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  # n8n for the integrations (integrations/n8n/README.md). Optional, local only:
  #   sb run -- docker compose --profile n8n up -d n8n      (UI on http://localhost:5678)
  # The API on the host reaches it at http://localhost:5678/webhook/...; the `api` container at
  # http://n8n:5678/webhook/... The shared secret comes from the environment, never from a file.
  n8n:
    image: n8nio/n8n:2.49.5
    profiles: ["n8n"]
    container_name: building-call-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The Code node that verifies Fincall's HMAC needs `crypto` and the shared secret
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      FINCALL_WEBHOOK_SECRET: ${BC_N8N_WEBHOOK_SECRET:-}
      # true: the booking workflow answers a demo slot without touching Google Calendar
      FINCALL_CALENDAR_DEMO: ${FINCALL_CALENDAR_DEMO:-true}
    volumes:
      - n8n_datos:/home/node/.n8n
      - ./integrations/n8n:/workflows:ro

volumes:
  db_datos:
  audio_privado:
  n8n_datos:
