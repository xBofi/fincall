# Building Call Assistant — desarrollo local con Docker Compose.
#
#   docker compose up -d db            # solo PostgreSQL (backend y frontend en tu máquina)
#   docker compose up -d               # todo: db + api + web
#   docker compose --profile tools run --rm migrations   # alembic upgrade head + semilla
#
# Secretos y claves de proveedores van en backend/.env (ignorado por git); aquí solo defaults.
# Ollama corre en el host (GPU): la API lo alcanza en host.docker.internal:11434.

name: building-call

services:
  db:
    image: postgres:17-alpine
    container_name: building-call-db
    restart: unless-stopped # la base de datos vuelve sola al arrancar Docker
    environment:
      POSTGRES_DB: building_call
      POSTGRES_USER: building_call
      POSTGRES_PASSWORD: ${BC_DB_PASSWORD:-building_call_dev}
    ports:
      - "127.0.0.1:5433:5432" # 5433 para no chocar con el PostgreSQL 17 instalado en Windows
    volumes:
      - db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U building_call -d building_call"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: building-call-api
    env_file:
      - backend/.env
    environment:
      BC_REPOSITORY: postgres
      BC_DATABASE_URL: postgresql+asyncpg://building_call:${BC_DB_PASSWORD:-building_call_dev}@db:5432/building_call
      BC_OLLAMA_URL: http://host.docker.internal:11434
      BC_AUDIO_DIR: /datos/audio
      BC_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      # Owner inicial de la consola (solo se crea si no hay usuarios; cambio obligatorio al entrar)
      BC_ADMIN_INICIAL_USUARIO: ${BC_ADMIN_INICIAL_USUARIO:-admin}
      BC_ADMIN_INICIAL_CONTRASENA: ${BC_ADMIN_INICIAL_CONTRASENA:-admin}
    volumes:
      - audio_privado:/datos/audio
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrations:
    build: ./backend
    profiles: ["tools"]
    env_file:
      - backend/.env
    environment:
      BC_REPOSITORY: postgres
      BC_DATABASE_URL: postgresql+asyncpg://building_call:${BC_DB_PASSWORD:-building_call_dev}@db:5432/building_call
    command: ["sh", "-c", "alembic upgrade head && python -m building_call.repos.seed"]
    depends_on:
      db:
        condition: service_healthy

  # Servidor de medios de LiveKit, autoalojado (spec 2026-10-21). En modo --dev usa las claves
  # devkey / secret: BC_LIVEKIT_API_KEY=devkey, BC_LIVEKIT_API_SECRET=secret. Solo para local.
  #   docker compose --profile voice up -d livekit
  #   cd backend; uv run --extra voice building-call-agent dev
  livekit:
    image: livekit/livekit-server:v1.13.8
    profiles: ["voice"]
    container_name: building-call-livekit
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880" # señalización (ws)
      - "127.0.0.1:7881:7881" # ICE por TCP
      - "127.0.0.1:7882:7882/udp" # medios (UDP)

  web:
    build: ./frontend
    container_name: building-call-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  db_datos:
  audio_privado:
