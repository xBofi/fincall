service_unavailable = "Lo sentimos, el servicio no está disponible en este momento. Inténtelo más tarde."
lowercase_summary = false

[[faq]]
keys = ["grab", "registr"]
answer = "Sí: la llamada se registra para gestionar su incidencia y para control de calidad. "
stems = true

[[faq]]
keys = ["tard", "when", "plazo", "vend"]
answer = "El plazo depende del especialista; el administrador le informará del seguimiento. "
stems = true

[[faq]]
keys = ["para que necesita", "para que quiere", "para que mi nombre", "por que mi nombre", "para que el nombre"]
answer = "No necesito su nombre: con la dirección y la vivienda es suficiente. "
stems = true

[[faq]]
keys = ["quien es", "quien eres", "maquina", "robot", "eres una persona", "es usted una persona"]
answer = "Soy el asistente automático del administrador de su comunidad. "
stems = true

[[faq]]
keys = ["coste", "cuesta", "pagar", "precio"]
answer = "Esta llamada no tiene coste adicional para usted. "
stems = true

