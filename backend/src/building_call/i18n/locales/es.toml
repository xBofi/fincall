refusal_words = ["incorrecto", "equivocado", "mal"]
# AssemblyAI transcribe un "sí" corto como "S." y un "no" como "N." (medido 2026-08-28)
short_yes = ["s", "si si", "s s"]
short_no = ["n", "no no"]
not_heard = ["estas ahi", "esta ahi", "sigues ahi", "sigue ahi", "me lo repite", "me lo repites", "repite", "repita", "no le he oido", "no le oigo", "no te oigo", "que has dicho", "que ha dicho", "como dice"]
