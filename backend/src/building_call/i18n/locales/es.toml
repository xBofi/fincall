[lexicon]
yes = ["si", "correcto", "exacto", "vale", "claro", "afirmativo", "eso es", "asi es", "ok", "efectivamente", "perfecto"]
no = ["no", "incorrecto", "negativo", "para nada", "que no", "no es", "tampoco"]
