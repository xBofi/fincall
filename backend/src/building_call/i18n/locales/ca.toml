# Català. Tracte de vostè, com en castellà. Mateix graf; plantilles traduïdes més avall.
code = "ca"
locale = "ca-ES"
name = "Catalan"
native_name = "Català"
rtl = false
parser = "generic"
prompts = "en"

[stt]
provider = "assemblyai"
language_code = "ca"
fallback = "browser"

[tts]
