[phrases]
default_question = "En què el puc ajudar?"
your_building = "la seva finca"
detail_prefix = "Detall:"
objection = "El veí no hi està d'acord: «{objection}»."
equipment = "Equip: {description}"
maintainer = "mantenidor {name} ({target})"
contract = "contracte {contract}"
warranty = "garantia fins al {date}"
proposed = "Professional que s'hauria avisat: {name}."
emergency_note = "EMERGÈNCIA: trucar al telèfon oficial de la finca i avisar el coordinador. Avisos simulats: l'assistent encara no truca ni envia res."
equipment_detail = "Què li passa exactament, al {kind}, i des de quan?"
faq_default = "Només puc gestionar incidències i sol·licituds de la seva finca. "
turn_failed = "Perdoni, no l'he entès bé. Ho pot repetir?"
technical_failure = "Disculpi, tinc un problema tècnic. Avisaré l'administrador perquè es posi en contacte amb vostè. Gràcies per trucar."
service_unavailable = "Ho sentim, el servei no està disponible en aquest moment. Torni-ho a provar més tard."
lowercase_summary = false

[[faq]]
keys = ["grav", "enregistr"]
answer = "Sí: la trucada s'enregistra per gestionar la seva incidència i per control de qualitat. "
stems = true

[[faq]]
keys = ["quan vindran", "quant trigaran", "trigar", "termini"]
answer = "El termini depèn del professional; l'administrador l'informarà del seguiment. "
stems = true

[[faq]]
keys = ["per que vol el meu nom", "per que necessita el meu nom", "el meu nom"]
answer = "No necessito el seu nom: amb l'adreça i l'habitatge n'hi ha prou. "
stems = true

[[faq]]
id = "who"
keys = ["qui es", "qui ets", "maquina", "robot", "es una persona"]
answer = "Sóc l'assistent automàtic de l'administrador de la seva comunitat. "
stems = true

[[faq]]
keys = ["cost", "costa", "pagar", "preu"]
answer = "Aquesta trucada no té cap cost addicional per a vostè. "
stems = true

