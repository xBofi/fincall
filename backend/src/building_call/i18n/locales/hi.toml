"farewell.farewell" = "ठीक है। कॉल करने के लिए धन्यवाद; आप कभी भी दोबारा कॉल कर सकते हैं। अलविदा।"
"notify_channel.closing" = "मैंने आपकी शिकायत दर्ज कर ली है। {notice} अगर चौबीस घंटे में कोई आपसे संपर्क न करे, तो कृपया हमें फिर से कॉल करें। कॉल करने के लिए धन्यवाद, अलविदा।"
"notify_channel.emergency_close" = "मैंने आपातकाल दर्ज कर लिया है और इसे प्राथमिकता से आपके प्रॉपर्टी मैनेजर को भेज रही हूँ। अगर किसी की जान को खतरा है, तो 112 पर कॉल करें। कॉल करने के लिए धन्यवाद।"
"notify_channel.no_specialist_notice" = "प्रॉपर्टी मैनेजर आज ही इसे देखेंगे, सही तकनीशियन तय करेंगे, और विज़िट तय करने के लिए {contact}।"
"notify_channel.coordinator_notice" = "मामला ज़रूरी होने के कारण मैं अभी समन्वयक और {specialist} को सूचित कर रही हूँ। {specialist_capitalized} जल्द से जल्द {contact} यह बताने के लिए कि वे कब आ सकते हैं; मैं अभी समय की पुष्टि नहीं कर सकती।"
"notify_channel.administrator_notice" = "मैं इसे प्रॉपर्टी मैनेजर को भेज रही हूँ, जो आज ही इसे देखेंगे और {contact} यह बताने के लिए कि इसे कैसे सुलझाया जाएगा।"
"notify_channel.specialist_notice" = "मैं अभी {specialist} को सूचित कर रही हूँ, जो विज़िट तय करने के लिए {contact}। मैं अभी समय नहीं बता सकती क्योंकि यह उनकी उपलब्धता पर निर्भर है; अगला कदम उनकी कॉल है।"
"notify_channel.visit_notice" = "मैं अभी {specialist} को सूचित कर रही हूँ। मैंने {slot} एक अस्थायी विज़िट बुक कर दी है, जो तकनीशियन की पुष्टि पर निर्भर है; वे इसकी पुष्टि के लिए {contact}।"
"notify_channel.phone_contact" = "आपको इसी नंबर पर कॉल करेंगे"
"notify_channel.generic_contact" = "आपसे संपर्क करेंगे"
