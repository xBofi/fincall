[[faq]]
keys = ["record", "recorded", "recording", "recordings"]
answer = "Yes, the call is recorded to handle your issue and for quality control. "

[[faq]]
keys = ["how long", "when", "how soon", "how quickly"]
answer = "That depends on the contractor; the property manager will keep you updated. "

[[faq]]
keys = ["my name", "need a name", "want a name"]
answer = "I don't need your name: the address and the apartment are enough. "

[[faq]]
id = "who"
keys = ["who is this", "who are you", "machine", "robot", "are you a person", "are you human", "are you real", "is this a bot"]
answer = "I'm FinCall, the automated assistant for your building's property manager. "

[[faq]]
keys = ["cost", "costs", "charge", "charged", "pay", "price", "fee", "fees"]
answer = "This call doesn't cost you anything extra. "

[categories]
general_maintenance = "general maintenance"
administrative = "paperwork"

[detail_questions]
electrical = "So the electrician knows what to expect: what exactly isn't working, and where is it?"
plumbing = "So the plumber knows what to expect: is it dripping or gushing, and do you know where it's coming from?"
elevator = "Is the elevator completely stopped or working on and off? Is anyone inside?"
locksmith = "Does the door not close, not open, or is it the lock? Since when?"
cleaning = "Where exactly, and since when?"
masonry = "Where exactly is the damage, and roughly how big is it?"
painting = "Which area needs painting, and what's wrong with it: damp, peeling, graffiti?"
_ = "Could you give me a bit more detail: where exactly, and since when?"
# Without knowing what is broken ("it stopped") the category is not guessed: we ask
unclassifiable = "What exactly isn't working, and where is it?"

[work_type_reasons]
replacement = "It needs replacing or construction work: it needs a quote and approval."
insurance_claim = "Vandalism or third-party damage: consider a claim on the building's insurance."
neighbour_dispute = "This is a dispute between neighbors, not a breakdown."
private_unit = "It seems to be inside a private apartment, not in a common area."

