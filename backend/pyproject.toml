[project]
name = "building-call"
version = "0.1.0"
description = "Building Call Assistant: voicebot de incidencias para comunidades de propietarios"
# audioop (grabación y telefonía) se eliminó en 3.13; sin este tope la API no arranca
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-auth[requests]>=2.61.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "livekit-api==1.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.optional-dependencies]
# TTS de servidor para telefonía (Piper local). Instalar con: uv sync --extra tts
tts = ["piper-tts>=1.7.0"]
voz = [
    "livekit-agents==1.8.5",
    "livekit-plugins-assemblyai==1.8.5",
    "livekit-plugins-elevenlabs==1.8.5",
    "livekit-plugins-silero==1.8.5",
]

[project.scripts]
building-call = "building_call.api.main:run"
building-call-agente = "building_call.voz.agente:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# El formateador gobierna la longitud del código; los textos hablados largos se permiten.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) en valores por defecto es el idioma de FastAPI
"src/building_call/operaciones_api.py" = ["B008"]
"src/building_call/acceso.py" = ["B008"]
"src/building_call/api/main.py" = ["B008"]
"src/building_call/flujo_api.py" = ["B008"]
"src/building_call/catalogo_api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
